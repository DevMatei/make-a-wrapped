<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>review desk - make a wrapped</title>
    <meta name="theme-color" content="#c084fc">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Bebas+Neue&family=Archivo+Black&family=Caveat:wght@400;700&family=Monoton&display=swap">
    <link rel="icon" type="image/svg+xml" href="favicon-lavender.svg">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/admin.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="marketplace-header">
        <div class="marketplace-header__lead">
          <a class="marketplace-header__back" href="/marketplace" aria-label="back to library">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <h1>the review desk</h1>
          <p class="marketplace-header__copy">someone made a template. give it a quick once-over before it hits the library.</p>
        </div>
        <div class="marketplace-header__actions">
          <a class="btn btn--ghost" href="/marketplace">back to library</a>
        </div>
      </header>

      <section class="card admin-connect">
        <div class="card__body">
          <label class="form__label" for="admin-key">admin key</label>
          <div class="form__field-group">
            <input id="admin-key" type="password" placeholder="paste the TEMPLATE_REVIEW_KEY from your .env">
            <button type="button" class="btn" id="admin-connect">connect</button>
            <button type="button" class="btn btn--ghost" id="admin-refresh" hidden>refresh</button>
          </div>
          <p class="admin-connect__status" id="admin-status" role="status" aria-live="polite" hidden></p>
        </div>
      </section>

      <section class="admin-list" id="admin-list">
        <p class="admin-empty" id="admin-empty" hidden>connect to see the queue. no key, no look.</p>
      </section>
    </main>
  </body>
</html>
