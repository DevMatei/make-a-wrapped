<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <title>Template Library - Make a Wrapped for ListenBrainz, Last.fm, Libre.fm & Navidrome</title>
    <meta name="description" content="Browse the Make a Wrapped template library. Pick an official or community theme for your ListenBrainz, Last.fm, Libre.fm, or Navidrome wrapped, or open the editor and make your own. Free, no account.">
    <meta name="keywords" content="Make a Wrapped, wrapped templates, Spotify Wrapped alternative, ListenBrainz wrapped, Last.fm wrapped, Navidrome wrapped, community templates, template editor">
    <meta name="author" content="DevMatei">
    <link rel="canonical" href="https://wrapped.devmatei.com/marketplace">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Template Library - Make a Wrapped for ListenBrainz, Last.fm, Libre.fm & Navidrome">
    <meta property="og:description" content="Find the perfect look for your wrapped. Official and community templates, plus a visual editor to design your own. Free and open source.">
    <meta property="og:url" content="https://wrapped.devmatei.com/marketplace">
    <meta property="og:image" content="https://github.com/user-attachments/assets/56c0dcd2-b111-4978-ac1f-2ae802f00237">
    <meta property="og:image:width" content="1857">

    <meta property="og:site_name" content="Make a Wrapped">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Template Library - Make a Wrapped">
    <meta name="twitter:description" content="Official and community wrapped templates, plus a visual editor. Free and open source.">
    <meta name="twitter:image" content="https://github.com/user-attachments/assets/56c0dcd2-b111-4978-ac1f-2ae802f00237">
    <meta name="twitter:image:alt" content="Make a Wrapped template library">
    <meta name="theme-color" content="#c084fc">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Bebas+Neue&family=Archivo+Black&family=Caveat:wght@400;700&family=Monoton&display=swap">
    <link rel="icon" type="image/svg+xml" href="favicon-lavender.svg">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/marketplace.js"></script>
    <!--MARKETPLACE_SEO-->
  </head>
  <body>
    <main class="page">
      <header class="marketplace-header">
        <div class="marketplace-header__lead">
          <a class="marketplace-header__back" href="/" aria-label="back to generator">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <h1>template library <span class="beta-badge">beta</span></h1>
          <p class="marketplace-header__copy">
            pick a look for your wrapped, or browse what the community is making.
          </p>
        </div>
        <div class="marketplace-header__actions">
          <a class="btn btn--ghost" href="/editor">create a template</a>
          <a class="btn" href="/">make a wrapped</a>
        </div>
      </header>

      <section class="card marketplace-toolbar">
        <div class="card__body marketplace-toolbar__body">
          <div class="marketplace-toolbar__search">
            <label class="form__label" for="template-search">search</label>
            <div class="form__field-group">
              <input id="template-search" type="search" placeholder="search templates, artists, styles...">
            </div>
          </div>
          <div class="marketplace-toolbar__sorts" role="group" aria-label="sort templates">
            <button type="button" class="marketplace-tab is-active" data-sort="featured">featured</button>
            <button type="button" class="marketplace-tab" data-sort="newest">newest</button>
            <button type="button" class="marketplace-tab" data-sort="popular">popular</button>
          </div>
          <div class="marketplace-toolbar__categories" id="template-categories" role="group" aria-label="filter by category"></div>
        </div>
      </section>

      <div
        data-devmatei-ad
        data-tier="banner"
        data-max-width="100%"
        data-radius="16px"
        data-fallback-text="keeping this running isn't free and i'm a teen working on this between classes. if you'd like to support the project, it would mean a lot. no pressure though."
      ></div>

      <section class="marketplace-grid" id="template-grid" aria-live="polite">
        <p class="marketplace-empty" id="template-empty" hidden>no templates match that search.</p>
      </section>

      <div
        data-devmatei-ad
        data-tier="text"
        data-max-width="100%"
        data-radius="16px"
        data-fallback-text="your project could be here"
      ></div>

      <footer class="marketplace-footer">
        <p>
          templates are always free. want to make your own? <a href="/editor">open the editor</a> - or read more about <a href="/templates">how templates work</a>.
        </p>
      </footer>
    </main>

    <script async src="https://sponsor.devmatei.com/embed/ad.js"></script>
  </body>
</html>
