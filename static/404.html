<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Make a Wrapped - 404</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="favicon-lavender.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-lavender-32.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="body--not-found">
    <main class="page page--not-found">
      <section class="card card--not-found">
        <div class="card__body not-found__body">
          <div class="not-found__content">
            <span class="not-found__code" aria-hidden="true">404</span>
            <h1>page not found</h1>
            <p class="not-found__lead">
              looks like this page doesn't exist. maybe the link was wrong, or maybe it got moved around. either way, let's get you back on track.
            </p>
            <a href="/" class="btn not-found__action">back to home</a>
          </div>
          <div class="not-found__art" aria-hidden="true">
            <div class="vinyl"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/404.js"></script>
  </body>
</html>
