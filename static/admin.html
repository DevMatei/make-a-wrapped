<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>review desk - make a wrapped</title>
    <meta name="theme-color" content="#15121f">
    <meta name="color-scheme" content="dark">
    <script>try{var t=localStorage.getItem('wrapped-theme');document.documentElement.dataset.theme=/^(lavender|mint|sunset)$/.test(t)?t:'lavender'}catch(e){document.documentElement.dataset.theme='lavender'}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="icon" type="image/svg+xml" href="favicon-lavender.svg">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/site.js"></script>
    <script type="module" src="js/admin.js"></script>
  </head>
  <body>
    <header class="topline">
      <a href="/">make a wrapped</a> <span aria-hidden="true">/</span> <span aria-current="page">review desk</span>
    </header>
    <main class="page">
      <header class="page-head">
        <div>
          <h1>review desk</h1>
          <p>someone made a template. give it a quick once-over before it hits the library.</p>
        </div>
      </header>

      <section class="admin-connect">
        <label class="label" for="admin-key">admin key</label>
        <div class="admin-connect__row">
          <input id="admin-key" type="password" placeholder="TEMPLATE_REVIEW_KEY from your .env" autocomplete="off">
          <button type="button" class="btn" id="admin-connect">connect</button>
          <button type="button" class="btn btn--ghost" id="admin-refresh" hidden>refresh</button>
        </div>
        <p class="admin-connect__status" id="admin-status" role="status" aria-live="polite" hidden></p>
      </section>

      <p class="admin-empty" id="admin-empty" hidden>connect to see the queue. no key, no look.</p>
      <section class="admin-list" id="admin-list"></section>
    </main>
  </body>
</html>
